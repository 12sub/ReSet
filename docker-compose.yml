version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: reset-db
    environment:
      POSTGRES_USER: reset
      POSTGRES_PASSWORD: resetpass
      POSTGRES_DB: reset
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reset -d reset"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reset-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://reset:resetpass@db:5432/reset?sslmode=disable
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: