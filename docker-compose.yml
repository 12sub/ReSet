version: "3.9"

services:
  python:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: reset-python
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reset-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: reset-db
    environment:
      POSTGRES_USER: reset
      POSTGRES_PASSWORD: resetpass
      POSTGRES_DB: reset
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reset -d reset"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reset-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://reset:resetpass@db:5432/reset?sslmode=disable
      REDIS_ADDR: redis:6379
      PYTHON_URL: http://python:8001
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      python:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: