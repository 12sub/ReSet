{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReSet — Subscription Cancellation Engine</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; color: #111827; line-height: 1.5; }
        header { background: #111827; color: white; padding: 1.5rem; text-align: center; }
        header h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
        header p { opacity: 0.8; font-size: 0.9rem; }
        .container { max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card h2 { margin-bottom: 1.25rem; font-size: 1.25rem; }
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; color: #374151; }
        .field input, .field select { width: 100%; padding: 0.625rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
        .btn { width: 100%; padding: 0.875rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; opacity: 1; }
        .alert { padding: 0.875rem; border-radius: 8px; margin-top: 1rem; font-size: 0.875rem; }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .detail { color: #4b5563; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .detail strong { color: #111827; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        .htmx-request.htmx-indicator { display: inline; }
        .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s linear infinite; margin-left: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer { text-align: center; margin-top: 2rem; font-size: 0.75rem; color: #9ca3af; }
    </style>
</head>
<body>
    <header>
        <h1>ReSet</h1>
        <p>Automated subscription cancellation engine</p>
    </header>
    <div class="container">
        {{template "content" .}}
    </div>
    <footer>Secured by Paystack · ReSet Engine</footer>
    <script src="https://js.paystack.co/v1/inline.js"></script>
</body>
</html>
{{end}}
