{{define "content"}}
<div class="card" id="subscription-card">
    <h2>Start Subscription</h2>
    
    <div class="field">
        <label>Email</label>
        <input type="email" id="email" value="demo@reset.ng" required>
    </div>
    
    <div class="field">
        <label>Plan</label>
        <select id="plan-code">
            <!-- REPLACE PLN_test_xxx WITH YOUR ACTUAL PAYSTACK PLAN CODE -->
            <option value="PLN_test_xxx">Basic — ₦5,000/month</option>
            <option value="PLN_test_yyy">Pro — ₦10,000/month</option>
        </select>
    </div>
    
    <div class="field">
        <label>Amount (kobo)</label>
        <input type="number" id="amount" value="500000" readonly>
    </div>

    <button class="btn btn-primary" onclick="payWithPaystack()">
        Subscribe with Paystack
        <span class="htmx-indicator spinner"></span>
    </button>
    
    <div id="result"></div>
</div>

<script>
function payWithPaystack() {
    const email = document.getElementById('email').value;
    const planCode = document.getElementById('plan-code').value;
    const amount = parseInt(document.getElementById('amount').value);
    
    const planAmounts = {
        'PLN_test_xxx': 500000,
        'PLN_test_yyy': 1000000
    };
    const actualAmount = planAmounts[planCode] || amount;
    document.getElementById('amount').value = actualAmount;

    const handler = PaystackPop.setup({
        // REPLACE WITH YOUR PAYSTACK TEST PUBLIC KEY
        key: 'pk_test_b6b81f9e419e9526041c24d932910027d282148d',
        email: email,
        amount: actualAmount,
        ref: 'reset_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        metadata: { plan_code: planCode },
        onClose: function() {
            document.getElementById('result').innerHTML = 
                '<div class="alert alert-error">Payment window closed. No charge was made.</div>';
        },
        callback: function(response) {
            htmx.ajax('POST', '/subscriptions', {
                target: '#subscription-card',
                swap: 'outerHTML',
                values: {
                    email: email,
                    plan_code: planCode,
                    reference: response.reference,
                    amount: actualAmount
                }
            });
        }
    });
    handler.openIframe();
}

document.getElementById('plan-code').addEventListener('change', function(e) {
    const amounts = { 'PLN_vcalvltypw7p0sz': 5000, 'PLN_test_yyy': 1000000 };
    document.getElementById('amount').value = amounts[e.target.value] || 500000;
});
</script>
{{end}}
